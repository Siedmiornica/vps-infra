server {
    listen 80;
    server_name surdev.pl www.surdev.pl;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name surdev.pl www.surdev.pl;

    ssl_certificate /etc/letsencrypt/live/surdev.pl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/surdev.pl/privkey.pem;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $site_upstream surdev-site:3000;
        proxy_pass http://$site_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

