x-lockdown: &lockdown
  read_only: true
  security_opt:
    - "no-new-privileges:true"

services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    restart: on-failure:3
    <<: *lockdown
    user: "65534:65534"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
      - '--collector.disable-defaults'
      - '--collector.cpu'
      - '--collector.meminfo'
      - '--collector.filesystem'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    networks:
      - web
    cap_drop:
      - ALL

  prometheus:
    image: quay.io/prometheus/prometheus:v3.14.0
    container_name: prometheus
    restart: on-failure:3
    <<: *lockdown
    user: "65534:65534"
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - web

  grafana:
    image: grafana/grafana:v13.2.0
    container_name: grafana
    restart: on-failure:3
    <<: *lockdown
    user: "472:472"
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - web

volumes:
  prometheus-data:
  grafana-data:

networks:
  web:
    external: true