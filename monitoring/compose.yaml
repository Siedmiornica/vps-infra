x-security: &security
  read_only: true
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL

x-web-network: &web-network
  networks:
    - web

x-restart-policy: &restart-policy
  restart: on-failure:3

services:
  node-exporter:
    image: docker.io/prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    container_name: node-exporter
    <<: [*restart-policy, *security, *web-network]
    user: "65534:65534"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
      - '--collector.disable-defaults'
      - '--collector.cpu'
      - '--collector.meminfo'
      - '--collector.filesystem'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"

  prometheus:
    image: docker.io/prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: prometheus
    <<: [*restart-policy, *security, *web-network]
    user: "65534:65534"
    tmpfs:
      - /tmp
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus


  grafana:
    image: docker.io/grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    container_name: grafana
    <<: [*restart-policy, *security, *web-network]
    user: "472:472"
    tmpfs:
      - /tmp
    environment:
      - GF_PLUGINS_PREINSTALL_DISABLED=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/config/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning/datasources/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

volumes:
  prometheus-data:
  grafana-data:
networks:
  web:
    external: true