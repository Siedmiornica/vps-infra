apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: GET
      prometheusType: Prometheus
      prometheusVersion: 3.14.0
      cacheLevel: 'High'
      seriesEndpoint: false
      timeInterval: 5s
