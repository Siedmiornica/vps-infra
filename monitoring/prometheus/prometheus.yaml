x-security: &security
  read_only: true
  security_opt:
    - "no-new-privileges:true"
  cap_drop:
    - ALL

x-web-network: &web-network
  networks:
    - web

services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    restart: on-failure:3
    <<: [*security, *web-network]
    user: "65534:65534"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($|/)'
      - '--collector.disable-defaults'
      - '--collector.cpu'
      - '--collector.meminfo'
      - '--collector.filesystem'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    expose:
      - "9100"
    networks:
      - web

  prometheus:
    image: quay.io/prometheus/prometheus:v3.14.0
    container_name: prometheus
    restart: on-failure:3
    <<: [*security, *web-network]
    user: "65534:65534"
    command:
      - '--config.file=/etc/prometheus/prometheus.yaml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    tmpfs:
      - /tmp
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus


  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    restart: on-failure:3
    <<: [*security, *web-network]
    user: "472:472"
    tmpfs:
      - /tmp
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/config/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning/datasources/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro


volumes:
  prometheus-data:
  grafana-data:

networks:
  web:
    external: true